@if (open()) {
  <div class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4"
       (click)="onCancel()">
    <div class="bg-white rounded-2xl shadow-xl max-w-lg w-full p-6"
         (click)="$event.stopPropagation()">

      <h2 class="text-lg font-semibold text-gray-900 mb-1">Apply moderation action</h2>
      <p class="text-sm text-gray-500 mb-4">{{ reportTitle() }}</p>

      <label class="text-xs font-medium text-gray-500 uppercase tracking-wide">Action</label>
      <div class="grid grid-cols-2 gap-2 mt-2 mb-4">
        @for (o of options; track o.value) {
          <button
            type="button"
            class="px-3 py-2 rounded-lg border text-sm text-left transition-colors"
            [class.border-primary]="actionType() === o.value"
            [class.bg-primary-50]="actionType() === o.value"
            [class.border-gray-200]="actionType() !== o.value"
            [class.text-destructive-text]="o.tone === 'danger' && actionType() === o.value"
            [class.text-warning-text]="o.tone === 'warning' && actionType() === o.value"
            (click)="setAction(o.value)">
            {{ o.label }}
          </button>
        }
      </div>

      <label class="text-xs font-medium text-gray-500 uppercase tracking-wide">Reason</label>
      <textarea class="form-input w-full mt-2" rows="3"
                placeholder="Why are you taking this action? (required for the audit log)"
                [value]="reason()"
                (input)="setReason($any($event.target).value)"></textarea>

      @if (error(); as err) {
        <p class="text-xs text-destructive-text mt-2">{{ err }}</p>
      }

      <div class="flex justify-end gap-2 mt-6">
        <button class="btn-outline" (click)="onCancel()">Cancel</button>
        <button class="btn-primary" (click)="onSubmit()">Confirm action</button>
      </div>
    </div>
  </div>
}
