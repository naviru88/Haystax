<div class="card mb-6">
  <div class="flex flex-wrap gap-3 items-end">

    <div class="flex flex-col gap-1 w-[180px] relative">
      <label class="text-xs font-medium text-gray-500">City</label>

      <button
        type="button"
        class="form-input text-left flex items-center justify-between gap-2"
        (click)="toggleCity()"
        [attr.aria-expanded]="cityOpen()"
        aria-haspopup="listbox">
        <span class="truncate" [class.text-gray-400]="!filters().city">
          {{ cityLabel() }}
        </span>
        <svg class="w-4 h-4 flex-shrink-0 text-gray-400 transition-transform"
             [class.rotate-180]="cityOpen()"
             xmlns="http://www.w3.org/2000/svg" fill="none"
             viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round"
                stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </button>

      @if (cityOpen()) {
        <div class="fixed inset-0 z-40" (click)="cityOpen.set(false)"></div>

        <div class="absolute top-full left-0 z-50 mt-1 w-full min-w-[240px]
                    bg-white border border-gray-200 rounded-lg shadow-lg overflow-hidden"
             role="listbox">
          <div class="p-2 border-b border-gray-100">
            <input
              id="city-search-input"
              type="text"
              class="form-input w-full text-sm"
              placeholder="Search city..."
              [value]="citySearch()"
              (input)="onCitySearchInput($event)"
              (keydown)="onCityKeydown($event)" />
          </div>

          <ul class="max-h-64 overflow-y-auto py-1">
            <li
              role="option"
              class="px-3 py-2 text-sm cursor-pointer hover:bg-gray-50"
              [class.bg-primary-50]="cityHighlight() === 0"
              (click)="clearCity()">
              All cities
            </li>

            @for (c of filteredCities(); track c; let i = $index) {
              <li
                role="option"
                class="px-3 py-2 text-sm cursor-pointer hover:bg-gray-50"
                [class.bg-primary-50]="cityHighlight() === i + 1"
                (click)="pickCity(c)">
                {{ c }}
              </li>
            }

            @if (filteredCities().length === 0) {
              <li class="px-3 py-2 text-sm text-gray-400 italic">
                No matching cities
              </li>
            }
          </ul>
        </div>
      }
    </div>

    <div class="flex flex-col gap-1 w-[110px]">
      <label class="text-xs font-medium text-gray-500">Min price</label>
      <input type="number" class="form-input" placeholder="0"
             [value]="filters().minPrice ?? ''"
             (change)="update('minPrice', $any($event.target).value ? +$any($event.target).value : undefined)" />
    </div>

    <div class="flex flex-col gap-1 w-[110px]">
      <label class="text-xs font-medium text-gray-500">Max price</label>
      <input type="number" class="form-input" placeholder="Any"
             [value]="filters().maxPrice ?? ''"
             (change)="update('maxPrice', $any($event.target).value ? +$any($event.target).value : undefined)" />
    </div>

    <div class="flex flex-col gap-1 w-[140px]">
      <label class="text-xs font-medium text-gray-500">Gender policy</label>
      <select class="form-input"
              [value]="filters().genderPolicy || ''"
              (change)="update('genderPolicy', $any($event.target).value || undefined)">
        @for (g of genderOptions; track g.value) {
          <option [value]="g.value">{{ g.label }}</option>
        }
      </select>
    </div>

    <div class="flex flex-col gap-1 w-[140px]">
      <label class="text-xs font-medium text-gray-500">Sort by</label>
      <select class="form-input"
              [value]="filters().sort || 'relevance'"
              (change)="update('sort', $any($event.target).value)">
        @for (s of sortOptions; track s.value) {
          <option [value]="s.value">{{ s.label }}</option>
        }
      </select>
    </div>

    <div class="flex-1 flex justify-end self-end">
      <button class="btn-outline whitespace-nowrap" (click)="clear()">
        Clear filters
      </button>
    </div>

  </div>
</div>
