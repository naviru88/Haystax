spring:
  application:
    name: haystax-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${HAYSTAX_DB_URL}
    username: ${HAYSTAX_DB_USER}
    password: ${HAYSTAX_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 5000

  rabbitmq:
    host: ${HAYSTAX_RABBITMQ_HOST:localhost}
    port: ${HAYSTAX_RABBITMQ_PORT:5672}
    username: ${HAYSTAX_RABBITMQ_USER:haystax}
    password: ${HAYSTAX_RABBITMQ_PASS:haystax}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

haystax:
  cors:
    allowed-origins: ${HAYSTAX_CORS_ORIGINS:http://localhost:4200}
  jwt:
    issuer: ${HAYSTAX_JWT_ISSUER:haystax}
    secret: ${HAYSTAX_JWT_SECRET:dev-only-secret-change-in-production}
  storage:
    public-base-url: ${HAYSTAX_STORAGE_PUBLIC_URL:}