<div class="card flex flex-col items-center justify-center text-center py-12">
  @switch (kind()) {
    @case ('loading') {
      <ng-icon name="heroArrowPath" size="40" class="text-primary animate-spin mb-3" />
      <p class="text-gray-600">{{ title() || 'Loading…' }}</p>
    }
    @case ('empty') {
      <ng-icon name="heroInbox" size="40" class="text-gray-300 mb-3" />
      <p class="font-medium text-gray-700 mb-1">{{ title() || 'Nothing here yet' }}</p>
      @if (message()) {
        <p class="text-sm text-gray-500">{{ message() }}</p>
      }
    }
    @case ('error') {
      <ng-icon name="heroExclamationTriangle" size="40" class="text-destructive mb-3" />
      <p class="font-medium text-gray-700 mb-1">{{ title() || 'Something went wrong' }}</p>
      @if (message()) {
        <p class="text-sm text-gray-500">{{ message() }}</p>
      }
    }
  }
</div>
