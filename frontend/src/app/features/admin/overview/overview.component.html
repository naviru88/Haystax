<!-- Top row: primary moderation stats -->
<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
  <app-stat-card
    label="Submitted reports"
    [value]="stats.submittedReportCount"
    tone="warning"
    hint="Awaiting first review" />
  <app-stat-card
    label="Under review"
    [value]="stats.underReviewReportCount"
    tone="primary"
    hint="Assigned to an admin" />
  <app-stat-card
    label="Pending listings"
    [value]="stats.pendingListingCount"
    tone="warning"
    hint="Awaiting publication" />
  <app-stat-card
    label="Removed listings"
    [value]="stats.removedListingCount"
    tone="danger"
    hint="Currently hidden from public" />
</div>

<!-- Second row: platform counts -->
<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
  <app-stat-card
    label="Published listings"
    [value]="stats.publishedListingCount" />
  <app-stat-card
    label="Active tenancies"
    [value]="stats.activeTenancyCount" />
  <app-stat-card
    label="Registered users"
    [value]="stats.totalUserCount" />
  <app-stat-card
    label="Suspended users"
    [value]="stats.suspendedUserCount"
    tone="danger" />
</div>

<!-- Metric selector for the chart -->
<div class="flex items-center justify-between mb-4 flex-wrap gap-3">
  <h2 class="text-lg font-semibold text-gray-900">Site analytics</h2>
  <div class="inline-flex items-center rounded-lg border border-gray-200 bg-white p-1 text-sm">
    @for (m of metricOptions; track m.key) {
      <button
        type="button"
        class="px-3 py-1.5 rounded-md transition-colors"
        [class.bg-primary]="activityMetric() === m.key"
        [class.text-white]="activityMetric() === m.key"
        [class.text-gray-700]="activityMetric() !== m.key"
        (click)="setMetric(m.key)">
        {{ m.label }}
      </button>
    }
  </div>
</div>

<app-activity-chart
  [data]="activity()"
  [metric]="activityMetric()" />

<!-- Report status breakdown -->
<div class="card mt-6">
  <h2 class="text-lg font-semibold text-gray-900 mb-4">Report status breakdown</h2>
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
    <div>
      <p class="text-xs text-gray-500 uppercase tracking-wide">Submitted</p>
      <p class="text-2xl font-bold text-warning-text mt-1">{{ stats.submittedReportCount }}</p>
    </div>
    <div>
      <p class="text-xs text-gray-500 uppercase tracking-wide">Under review</p>
      <p class="text-2xl font-bold text-primary mt-1">{{ stats.underReviewReportCount }}</p>
    </div>
    <div>
      <p class="text-xs text-gray-500 uppercase tracking-wide">Resolved</p>
      <p class="text-2xl font-bold text-success-text mt-1">{{ stats.resolvedReportCount }}</p>
    </div>
    <div>
      <p class="text-xs text-gray-500 uppercase tracking-wide">Rejected</p>
      <p class="text-2xl font-bold text-gray-500 mt-1">{{ stats.rejectedReportCount }}</p>
    </div>
  </div>
</div>
